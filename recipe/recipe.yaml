schema_version: 1

context:
  version: "0.35.0"

package:
  name: scrapy-zyte-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scrapy-zyte-api/scrapy_zyte_api-${{ version }}.tar.gz
  sha256: ea2560074e76ccbdaf6d3b93e5055898ae475070580f8c91f6572b51795eea57

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - packaging >=20.0
    - scrapy >=2.0.1
    - typing_extensions >=4.1.0
    - zyte-api >=0.6.0

tests:
  - python:
      imports:
        - scrapy_zyte_api
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/scrapy-plugins/scrapy-zyte-api
  summary: Client library to process URLs through Zyte API
  license: BSD-3-Clause
  license_file: LICENSE.txt
  documentation: https://scrapy-zyte-api.readthedocs.io/en/stable/
  repository: https://github.com/scrapy-plugins/scrapy-zyte-api

extra:
  recipe-maintainers:
    - AdrianAtZyte
    - wRAR
